<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFCF6">
<title>濟州島四天三夜旅遊手冊</title>
<!-- Huninn（jf open 粉圓）：Google Fonts，僅 400 字重；離線或載入失敗時改用下方 --font 的系統字型 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&display=swap">
<style>
:root{
  --paper:#FFFCF6;
  --ink:#3E3A39;
  --ink-soft:#6B6563;
  --coral:#F2A497;
  --yellow:#F6D27A;
  --water:#A8D3E6;
  --green:#B9DAA5;
  --coral-pale:#FBE3DE;
  --yellow-pale:#FDF1CF;
  --water-pale:#E2F1F7;
  --green-pale:#E6F2DE;
  --line:3px;
  --r-lg:28px 24px 30px 22px / 24px 30px 22px 28px;
  --r-md:18px 16px 20px 15px / 16px 20px 15px 18px;
  --nav-h:58px;
  --safe-top:env(safe-area-inset-top, 0px);
  --font:"Huninn","PingFang TC","Noto Sans TC","Microsoft JhengHei","Heiti TC","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html{
  -webkit-text-size-adjust:100%;
  scroll-padding-top:calc(var(--nav-h) + var(--safe-top) + 12px);
}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:var(--font);
  font-weight:400;
  font-size:16px;
  line-height:1.6;
  padding-top:calc(var(--nav-h) + var(--safe-top));
  padding-left:env(safe-area-inset-left,0px);
  padding-right:env(safe-area-inset-right,0px);
  overflow-x:hidden;
}
h1,h2,h3,p{margin:0}
a{color:inherit}
button{font:inherit;color:inherit}
svg{display:block}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px dashed var(--ink);outline-offset:3px}

/* ---------- 固定頂端選單 ---------- */
.nav{
  position:fixed;top:0;left:0;right:0;z-index:50;
  padding-top:var(--safe-top);
  background:var(--paper);
  border-bottom:var(--line) solid var(--ink);
}
.nav ul{
  list-style:none;margin:0 auto;padding:0 10px;
  max-width:880px;height:var(--nav-h);
  display:flex;align-items:center;justify-content:space-between;gap:4px;
}
.nav a{
  display:flex;align-items:center;gap:6px;
  padding:6px 12px;
  border:var(--line) solid transparent;
  border-radius:999px;
  text-decoration:none;
  font-size:15px;white-space:nowrap;
  transition:background-color .2s,border-color .2s;
}
.nav a svg{width:20px;height:20px;flex:none}
.nav a[aria-current="true"]{background:var(--yellow);border-color:var(--ink)}
@media (max-width:480px){
  .nav ul{padding:0 6px;gap:2px}
  .nav a{padding:5px 8px;font-size:14px;gap:3px}
  .nav a svg{display:none}
}

main{max-width:880px;margin:0 auto;padding:0 16px calc(40px + env(safe-area-inset-bottom,0px))}
section{padding-top:36px}
.sec-head{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.sec-head svg{width:40px;height:40px;flex:none}
.sec-head h2{font-size:24px;line-height:1.3;font-weight:400}
.sec-head p{font-size:13px;color:var(--ink-soft)}

.card{
  background:#fff;
  border:var(--line) solid var(--ink);
  border-radius:var(--r-lg);
  padding:18px;
}
.pill{
  display:inline-flex;align-items:center;gap:4px;
  padding:1px 10px;
  border:2px solid var(--ink);border-radius:999px;
  font-size:13px;line-height:1.6;white-space:nowrap;
}

/* ---------- Hero ---------- */
.hero{padding-top:20px}
.hero-card{
  background:var(--water-pale);
  border:var(--line) solid var(--ink);
  border-radius:var(--r-lg);
  overflow:hidden;
}
.hero-art{width:100%;height:auto;aspect-ratio:360/200;border-bottom:var(--line) solid var(--ink);background:var(--water-pale)}
.hero-body{padding:18px 18px 22px;background:var(--paper)}
.hero-kicker{font-size:14px;color:var(--ink-soft)}
.hero h1{font-size:clamp(28px,7.5vw,40px);line-height:1.25;font-weight:400;margin:4px 0 10px}
.nowrap{display:inline-block}
.hero-meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.hero-meta .pill{background:#fff;font-size:14px}
.countdown{
  display:flex;align-items:center;gap:14px;
  padding:12px 16px;
  background:var(--coral-pale);
  border:var(--line) solid var(--ink);border-radius:var(--r-md);
}
.countdown-num{
  flex:none;min-width:72px;height:72px;padding:0 8px;
  display:grid;place-items:center;
  background:var(--coral);border:var(--line) solid var(--ink);border-radius:50%;
  font-size:30px;line-height:1;
}
.countdown-num small{font-size:13px;display:block;text-align:center;margin-top:2px}
.countdown-text strong{display:block;font-weight:400;font-size:19px;line-height:1.35}
.countdown-text span{font-size:13px;color:var(--ink-soft)}
@media (min-width:720px){
  .hero-card{display:grid;grid-template-columns:1.1fr 1fr}
  .hero-art{height:100%;aspect-ratio:auto;border-bottom:0;border-right:var(--line) solid var(--ink)}
  .hero-body{padding:28px}
}

/* 插圖輕微動態（僅 transform） */
.float{animation:float 6s ease-in-out infinite}
.sway{animation:sway 5s ease-in-out infinite;transform-origin:50% 0;transform-box:fill-box}
.bob{animation:bob 4s ease-in-out infinite}
@keyframes float{0%,100%{transform:translate(0,0)}50%{transform:translate(6px,-6px)}}
@keyframes sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(3px)}}
.paused .float,.paused .sway,.paused .bob{animation-play-state:paused}

/* ---------- 航班＋租車 ---------- */
.flights{display:grid;gap:16px}
@media (min-width:720px){.flights{grid-template-columns:1fr 1fr}}
.flight{padding:0;overflow:hidden}
.flight-top{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:10px 16px;border-bottom:var(--line) solid var(--ink);
}
.flight.out .flight-top{background:var(--green)}
.flight.back .flight-top{background:var(--water)}
.flight-top .dir{font-size:18px}
.flight-top .no{font-size:15px}
.flight-route{
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;
  padding:16px 16px 8px;
}
.port .code{font-size:26px;line-height:1.2;letter-spacing:.04em}
.port .time{font-size:22px;line-height:1.3}
.port .date{font-size:13px;color:var(--ink-soft)}
.port .name{font-size:13px;line-height:1.4;margin-top:2px}
.port.arr{text-align:right}
.route-mid{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--ink-soft);text-align:center}
.route-mid svg{width:44px;height:24px}
.next-day{display:inline-block;margin-left:4px;padding:0 6px;font-size:12px;line-height:1.6;background:var(--coral);border:2px solid var(--ink);border-radius:8px;color:var(--ink);vertical-align:2px}
.flight-foot{padding:4px 16px 14px;font-size:13px;color:var(--ink-soft)}
.flight-foot p+p{margin-top:2px}
.car{margin-top:16px;background:var(--yellow-pale)}
.car h3{font-size:18px;font-weight:400;display:flex;align-items:center;gap:8px}
.car h3 svg{width:36px;height:24px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin-top:10px;font-size:14px}
.kv dt{color:var(--ink-soft)}
.kv dd{margin:0;overflow-wrap:anywhere}
.car-legs{display:grid;gap:10px;margin-top:12px}
@media (min-width:560px){.car-legs{grid-template-columns:1fr 1fr}}
.car-leg{background:#fff;border:2px solid var(--ink);border-radius:var(--r-md);padding:10px 12px;font-size:14px}
.car-leg .lbl{display:inline-block;background:var(--yellow);border:2px solid var(--ink);border-radius:8px;padding:0 8px;font-size:13px;margin-bottom:4px}
.note-small{font-size:12px;color:var(--ink-soft);margin-top:10px;line-height:1.5}

.btn-map{
  display:inline-flex;align-items:center;gap:6px;
  margin-top:10px;padding:6px 14px;
  background:var(--water);border:2px solid var(--ink);border-radius:999px;
  font-size:14px;text-decoration:none;
}
.btn-map svg{width:16px;height:16px}

/* ---------- 每日行程 ---------- */
.tabs{
  display:grid;grid-template-columns:repeat(4,1fr);gap:8px;
  position:sticky;top:calc(var(--nav-h) + var(--safe-top));z-index:10;
  padding:10px 0;background:var(--paper);
}
.tab{
  display:block;
  padding:8px 4px;
  background:#fff;border:var(--line) solid var(--ink);border-radius:var(--r-md);
  text-align:center;line-height:1.3;text-decoration:none;
  transition:background-color .2s,transform .2s;
}
.tab .d{display:block;font-size:16px}
.tab .w{display:block;font-size:12px;color:var(--ink-soft)}
.tab[aria-current="true"]{background:var(--coral);transform:translateY(-2px)}
.tab[aria-current="true"] .w{color:var(--ink)}
.tab .today{display:block;font-size:11px;margin-top:2px}
@media (hover:hover){.tab:hover{background:var(--coral-pale)}.tab[aria-current="true"]:hover{background:var(--coral)}}

/* 四天依序展開；跳轉時預留固定選單＋日期列的高度（--tabs-h 由 JS 依實際高度設定） */
.day{margin-top:6px;scroll-margin-top:calc(var(--tabs-h, 96px) + 4px)}
.day + .day{margin-top:64px}
@media (min-width:640px){.day + .day{margin-top:80px}}
.day-head{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--green-pale)}
.day-head-text{min-width:0}
.day-art{flex:none;width:80px;height:80px;overflow:hidden;background:#fff;border:var(--line) solid var(--ink);border-radius:18px}
.day-art svg{width:100%;height:100%}
@media (min-width:640px){.day-art{width:96px;height:96px}}
.day:nth-child(2) .day-head{background:var(--yellow-pale)}
.day:nth-child(3) .day-head{background:var(--water-pale)}
.day:nth-child(4) .day-head{background:var(--coral-pale)}
.day-head .no{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink-soft)}
.day-badge{padding:0 10px;font-size:16px;color:var(--ink);background:#fff;border:2px solid var(--ink);border-radius:999px}
.day-head h3{font-size:21px;font-weight:400;line-height:1.35;margin-top:6px}

.tl{list-style:none;margin:18px 0 0;padding:0;position:relative}
.tl::before{
  content:"";position:absolute;left:9px;top:8px;bottom:8px;
  border-left:var(--line) dashed var(--ink);
}
.tl-item{position:relative;padding:0 0 18px 34px}
.tl-dot{
  position:absolute;left:0;top:4px;
  width:21px;height:21px;border-radius:50%;
  background:var(--paper);border:var(--line) solid var(--ink);
}
.tl-item.k-flight .tl-dot{background:var(--green)}
.tl-item.k-ferry .tl-dot{background:var(--water)}
.tl-item.k-move .tl-dot{background:var(--yellow)}
.tl-time{font-size:15px;line-height:1.4;font-variant-numeric:tabular-nums}
.tl-time .open{font-size:13px;color:var(--ink-soft);margin-left:2px}
.tl-box{display:flex;align-items:center;gap:10px;margin-top:4px;padding:10px 14px;background:#fff;border:2px solid var(--ink);border-radius:var(--r-md)}
.tl-main{flex:1;min-width:0}
.tl-art{flex:none;width:48px;height:48px}
.tl-act{font-size:17px;line-height:1.45;overflow-wrap:anywhere}
.tl-loc{margin-top:4px;font-size:14px;line-height:1.5;overflow-wrap:anywhere;color:var(--ink-soft)}
.tl-loc .pin{display:inline-block;width:14px;height:14px;vertical-align:-2px;margin-right:3px}
.maplink{
  color:var(--ink);text-decoration:underline;text-decoration-thickness:2px;
  text-underline-offset:3px;text-decoration-color:var(--coral);
}
.map-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.map-chip{
  display:inline-flex;align-items:center;gap:4px;
  padding:2px 10px;font-size:13px;text-decoration:none;
  background:var(--water-pale);border:2px solid var(--ink);border-radius:999px;
}
.map-chip svg{width:13px;height:13px}
.tl-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.t-car{background:var(--yellow)}
.t-taxi{background:var(--coral)}
.t-ferry{background:var(--water)}
.t-plane{background:var(--green)}
.t-walk{background:var(--green-pale)}
.t-ebike{background:var(--yellow-pale)}
.planb{margin-top:16px;padding:12px 16px;background:var(--water-pale);border:var(--line) dashed var(--ink);border-radius:var(--r-md)}
.planb summary{cursor:pointer;font-size:17px;line-height:1.5;list-style-position:inside}
.planb-hint{margin-left:8px;font-size:13px;color:var(--ink-soft)}
.planb[open] .planb-hint{display:none}
.planb-note{margin-top:8px;font-size:14px;line-height:1.6;color:var(--ink-soft)}
.planb .tl{margin-top:14px}
.tl-stay{
  margin-top:4px;padding:14px 16px;
  display:flex;gap:12px;align-items:center;
  background:var(--yellow-pale);
  border:var(--line) solid var(--ink);border-radius:var(--r-md);
}
.tl-stay svg{width:40px;height:40px;flex:none}
.tl-stay .lbl{font-size:13px;color:var(--ink-soft)}
.tl-stay .nm{font-size:18px;line-height:1.35;overflow-wrap:anywhere}
.tl-stay .ar{font-size:14px}
@media (min-width:640px){
  .tl::before{left:131px}
  .tl-item{display:grid;grid-template-columns:112px 1fr;gap:0 40px;padding-left:0}
  .tl-dot{left:122px;top:12px}
  .tl-time{text-align:right;padding-top:10px}
  .tl-box{margin-top:0}
  .tl-stay{margin-left:152px}
}

/* ---------- 住宿 ---------- */
.stays{display:grid;gap:16px}
@media (min-width:720px){.stays{grid-template-columns:1fr 1fr}}
.stay{padding:0;overflow:hidden}
.stay-top{display:flex;gap:12px;align-items:center;padding:14px 16px;border-bottom:var(--line) solid var(--ink)}
.stay:nth-child(1) .stay-top{background:var(--coral-pale)}
.stay:nth-child(2) .stay-top{background:var(--water-pale)}
.stay-top svg{width:44px;height:44px;flex:none}
.stay-top h3{font-size:19px;font-weight:400;line-height:1.35;overflow-wrap:anywhere}
.stay-top p{font-size:13px;color:var(--ink-soft)}
.stay-body{padding:12px 16px 16px}
.pack-list{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (min-width:720px){.pack-list{grid-template-columns:repeat(3,1fr)}}
.pack-item{display:flex;align-items:center;gap:10px;padding:10px 12px;font-size:15px;line-height:1.4;cursor:pointer;background:#fff;border:2px solid var(--ink);border-radius:var(--r-md);overflow-wrap:anywhere;transition:background-color .2s}
.pack-item input{position:absolute;opacity:0;width:1px;height:1px}
.pack-box{flex:none;display:grid;place-items:center;width:22px;height:22px;background:#fff;border:var(--line) solid var(--ink);border-radius:7px}
.pack-box svg{width:14px;height:14px;opacity:0;transform:scale(.4);transition:opacity .15s,transform .2s}
.pack-item:has(input:focus-visible){outline:3px dashed var(--ink);outline-offset:2px}
.pack-item.done{background:var(--green-pale)}
.pack-item.done .pack-box{background:var(--green)}
.pack-item.done .pack-box svg{opacity:1;transform:none}
.pack-item.done .pack-txt{color:var(--ink-soft);text-decoration:line-through;text-decoration-thickness:2px}
.pack-bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-bottom:12px;font-size:14px;color:var(--ink-soft)}
.pack-bar button{padding:2px 12px;font-size:13px;cursor:pointer;background:#fff;border:2px solid var(--ink);border-radius:999px}
/* ---------- 每日路線圖 ---------- */
.route-map{margin:18px 0 0;padding:12px 12px 10px;background:#fff;border:var(--line) solid var(--ink);border-radius:var(--r-md)}
@media (max-width:360px){.route-map{padding:10px 6px 8px}}
.rm-cap{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;margin:0 2px 8px;font-size:16px}
.rm-cap-sub{font-size:13px;color:var(--ink-soft)}
.route-map svg[role="img"]{display:block;width:100%;height:auto;max-width:560px;margin:0 auto;border:2px solid var(--ink);border-radius:14px;background:#D9EDF5}
.rm-sea{fill:#D9EDF5}
.rm-land{fill:#FFFCF6;stroke:var(--ink);stroke-width:2.2;stroke-linejoin:round}
.rm-halla path{fill:var(--green);stroke:var(--ink);stroke-width:2;stroke-linejoin:round}
.rm-halla path.snow{fill:none;stroke:#fff;stroke-width:2.5;stroke-linecap:round}
.rm-halla text{font-size:10.5px;fill:var(--ink-soft)}
.rm-compass path{fill:var(--coral);stroke:var(--ink);stroke-width:1.8;stroke-linejoin:round}
.rm-compass text{font-size:11px;fill:var(--ink)}
.rm-mini-bg{fill:#fff;stroke:var(--ink);stroke-width:5}
.rm-mini-land{fill:var(--green-pale);stroke:var(--ink);stroke-width:6;stroke-linejoin:round}
.rm-mini-box{fill:rgba(242,164,151,.35);stroke:#D9705E;stroke-width:7;stroke-linejoin:round}
.rm-case{fill:none;stroke:var(--ink);stroke-width:6.5;stroke-linecap:round}
.rm-core{fill:none;stroke-width:3.4;stroke-linecap:round}
.rm-line{fill:none;stroke:var(--ink);stroke-width:3;stroke-linecap:round}
.rm-thin{fill:none;stroke:var(--ink);stroke-width:2}
.rm-arrow{fill:var(--ink);stroke:var(--ink);stroke-width:1.2;stroke-linejoin:round}
.rm-lens-bg{fill:#D9EDF5}
.rm-lens-rim{fill:none;stroke:var(--ink);stroke-width:3}
.rm-lens-src{fill:none;stroke:var(--ink);stroke-width:1.8;stroke-dasharray:3 3}
.rm-lens-link{stroke:var(--ink);stroke-width:1.8;stroke-dasharray:3 3}
.rm-lens-name{font-size:12px;fill:var(--ink);paint-order:stroke;stroke:#D9EDF5;stroke-width:4px;stroke-linejoin:round}
.rm-stop{cursor:pointer;outline:none}
.rm-node{stroke:var(--ink);stroke-width:2.4}
.rm-node.k-start{fill:var(--green)}
.rm-node.k-mid{fill:var(--yellow)}
.rm-node.k-end{fill:var(--coral)}
.rm-ring{fill:none;stroke:var(--ink);stroke-width:1.8}
.rm-num{font-size:12px;text-anchor:middle;fill:var(--ink);pointer-events:none}
.rm-lab{font-size:12.5px;fill:var(--ink);paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
.rm-stop:hover .rm-node,.rm-stop:focus-visible .rm-node{stroke-width:3.6}
.rm-stop:focus-visible .rm-lab{text-decoration:underline}
.rm-legend{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:8px;padding:0 2px;font-size:13px;color:var(--ink-soft)}
.rm-key{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.rm-key svg{width:30px;height:14px}
.rm-dot{display:inline-block;width:13px;height:13px;border:2px solid var(--ink);border-radius:50%}
.rm-dot.k-start{background:var(--green)}
.rm-dot.k-mid{background:var(--yellow)}
.rm-dot.k-end{background:var(--coral)}
.tl-item{scroll-margin-top:calc(var(--tabs-h, 96px) + 12px)}
.tl-item.flash .tl-box{animation:rm-flash 2.2s ease-out}
@keyframes rm-flash{0%,35%{background:var(--yellow-pale);box-shadow:0 0 0 4px var(--yellow)}100%{background:#fff;box-shadow:0 0 0 0 transparent}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .tl-item.flash .tl-box{background:var(--yellow-pale);box-shadow:0 0 0 4px var(--yellow)}
  .tab[aria-current="true"]{transform:none}
}
</style>
</head>
<body>

<!-- 共用 SVG 圖示 -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">

/* 取得某時區的日期字串 YYYY-MM-DD；不支援時區時退回裝置時間 */
function ymdIn(date, tz) {
  try {
    return new Intl.DateTimeFormat("en-CA", { timeZone: tz, year: "numeric", month: "2-digit", day: "2-digit" }).format(date);
  } catch (e) {
    const p = (n) => String(n).padStart(2, "0");
    return `${date.getFullYear()}-${p(date.getMonth() + 1)}-${p(date.getDate())}`;
  }
}
const dayIndex = (ymd) => { const [y, m, d] = ymd.split("-").map(Number); return Math.round(Date.UTC(y, m - 1, d) / 864e5); };

/* 測試用：網址加 ?now=2026-10-30T10:00:00+09:00 可模擬當下時間 */
function getNow() {
  const p = new URLSearchParams(location.search).get("now");
  const t = p ? new Date(p) : null;
  return t && !isNaN(t) ? t : new Date();
}

/* ===================== Hero／倒數 ===================== */
function tripStatus(now) {
  const start = new Date(TRIP.tripStart), end = new Date(TRIP.tripEnd);
  if (now < start) {
    const diff = dayIndex(TRIP.startDate) - dayIndex(ymdIn(now, "Asia/Taipei"));
    return { phase: "before", days: Math.max(diff, 0) };
  }
  if (now < end) {
    const d = dayIndex(ymdIn(now, "Asia/Seoul")) - dayIndex(TRIP.startDate) + 1;
    return { phase: "during", day: Math.min(Math.max(d, 1), DAYS.length), homebound: d > DAYS.length };
  }
  return { phase: "after" };
}

function updateCountdown() {
  const s = tripStatus(getNow());
  const num = $("cdNum"), text = $("cdText"), sub = $("cdSub");
  if (s.phase === "before") {
    if (s.days === 0) {
      num.innerHTML = "GO";
      text.textContent = "今天出發！";
    } else {
      num.innerHTML = `${s.days}<small>天</small>`;
      text.textContent = s.days === 1 ? "明天就出發囉！" : `距離出發還有 ${s.days} 天`;
    }
    sub.textContent = "2026/10/29（四）03:05 桃園起飛";
  } else if (s.phase === "during") {
    num.innerHTML = `<small>第</small>${CN_NUM[s.day - 1]}<small>天</small>`;
    text.textContent = s.homebound ? "回程中，即將抵達桃園" : `旅程進行中・${dayName(s.day - 1)}`;

    text.textContent = "旅程已結束，歡迎回家！";
    sub.textContent = "2026/10/29 – 11/2 濟州島之旅";
  }
}

/* ===================== 每日路線圖（手繪示意，北方朝上） ===================== */
const RM_W = 340;                                  // 路線圖 viewBox 寬度
const RM_COS = Math.cos(33.4 * Math.PI / 180);     // 經度方向的距離修正
const RM_MIN = 26;                                 // 相鄰景點最小間距（太近時略為拉開，方向不變）
const RM_MODES = {
  car: { core: "#F6D27A", label: "開車" },
  taxi: { core: "#F2A497", label: "計程車" },
  ebike: { core: "#B9DAA5", label: "電動腳踏車" },
  bus: { core: "#FFFFFF", label: "接駁車" },
  walk: { dash: "0.1 6.5", label: "步行" },
  ferry: { dash: "7 5", label: "渡輪" },
  none: {}
};
const geoPts = (str) => {
  const n = str.split(",").map(Number), out = [];
  for (let i = 0; i < n.length; i += 2) out.push([33 + n[i] / 1e4, 126 + n[i + 1] / 1e4]);
  return out;
};
const GEO_PTS = { jeju: geoPts(GEO.jeju), udo: geoPts(GEO.udo) };
const f1 = (v) => Math.round(v * 10) / 10;

function rmProjector(v) {
  const k = RM_W / ((v.e - v.w) * RM_COS);
  return { k, h: Math.round((v.n - v.s) * k), p: (ll) => [(ll[1] - v.w) * RM_COS * k, (v.n - ll[0]) * k] };
}
// 海岸線：投影後用 Chaikin 圓角化兩次，看起來像手繪
function ringPath(pts, p) {
  let q = pts.map(p);
  for (let t = 0; t < 2; t++) {
    const o = [];
    q.forEach((a, i) => { const b = q[(i + 1) % q.length]; o.push([a[0] * .75 + b[0] * .25, a[1] * .75 + b[1] * .25], [a[0] * .25 + b[0] * .75, a[1] * .25 + b[1] * .75]); });
    q = o;
  }
  return "M" + q.map((a) => a.map(f1).join(" ")).join("L") + "Z";
}

// 太近的點互相推開：沿著兩點「實際」的方向推，所以相對方位不變（只在示意圖上拉開）
function relax(pos, keys) {
  const orig = {};
  keys.forEach((k) => { orig[k] = pos[k].slice(); });
  for (let t = 0; t < 80; t++) {
    for (let a = 0; a < keys.length; a++) for (let b = a + 1; b < keys.length; b++) {
      const A = pos[keys[a]], B = pos[keys[b]];
      const d = Math.hypot(B[0] - A[0], B[1] - A[1]);
      if (d >= RM_MIN) continue;
      let ux = orig[keys[b]][0] - orig[keys[a]][0], uy = orig[keys[b]][1] - orig[keys[a]][1];
      const ul = Math.hypot(ux, uy);
      if (ul < 0.01) { ux = 1; uy = 0; } else { ux /= ul; uy /= ul; }
      const push = (RM_MIN - d) / 2 + 0.2;
      A[0] -= ux * push; A[1] -= uy * push;
      B[0] += ux * push; B[1] += uy * push;
    }
  }
}

// 一段路線：略彎的手繪曲線＋中段的方向箭頭
function legSvg(A, B, mode, bend) {
  const dx = B[0] - A[0], dy = B[1] - A[1], len = Math.hypot(dx, dy);
  if (len < 1) return "";
  const c = [(A[0] + B[0]) / 2 - dy / len * len * bend, (A[1] + B[1]) / 2 + dx / len * len * bend];
  const d = `M${f1(A[0])} ${f1(A[1])}Q${f1(c[0])} ${f1(c[1])} ${f1(B[0])} ${f1(B[1])}`;
  const m = RM_MODES[mode] || RM_MODES.none;
  let h;
  if (m.core) h = `<path d="${d}" class="rm-case"/><path d="${d}" class="rm-core" stroke="${m.core}"/>`;
  else if (m.dash) h = `<path d="${d}" class="rm-line" stroke-dasharray="${m.dash}"/>`;
  else h = `<path d="${d}" class="rm-thin"/>`;
  if (len >= 18) {
    const t = 0.55, u = 1 - t;
    const x = u * u * A[0] + 2 * u * t * c[0] + t * t * B[0], y = u * u * A[1] + 2 * u * t * c[1] + t * t * B[1];
    const tx = 2 * u * (c[0] - A[0]) + 2 * t * (B[0] - c[0]), ty = 2 * u * (c[1] - A[1]) + 2 * t * (B[1] - c[1]);
    const ang = Math.atan2(ty, tx) * 180 / Math.PI;
    h += `<path d="M-6 -4 5 0-6 4z" class="rm-arrow" transform="translate(${f1(x)} ${f1(y)}) rotate(${f1(ang)})"/>`;
  }
  return h;
}

const LAB_OFF = { n: [0, -17, "middle"], s: [0, 26, "middle"], e: [16, 5, "start"], w: [-16, 5, "end"],
  ne: [12, -12, "start"], nw: [-12, -12, "end"], se: [12, 22, "start"], sw: [-12, 22, "end"] };

function stopSvg(st, n, xy, kind, di) {
  const [ox, oy, anchor] = LAB_OFF[st.lab || "e"];
  const [x, y] = xy.map(f1);
  return `<a class="rm-stop" href="#d${di + 1}-i${st.items[0]}" data-target="d${di + 1}-i${st.items[0]}" aria-label="${n}. ${esc(st.name)}，跳到時間軸">
      <circle cx="${x}" cy="${y}" r="10.5" class="rm-node k-${kind}"/>
      ${kind === "end" ? `<circle cx="${x}" cy="${y}" r="14.5" class="rm-ring"/>` : ""}
      <text x="${x}" y="${f1(y + 4.3)}" class="rm-num">${n}</text>
      <text x="${f1(x + ox)}" y="${f1(y + oy)}" text-anchor="${anchor}" class="rm-lab">${esc(st.name)}</text>
    </a>`;
}

function routeMapHtml(d, di) {
  const r = d.route;
  if (!r) return "";
  const P = rmProjector(r.view), H = P.h;
  // 放大圈（可以有多個）：圈內景點用放大後的位置
  const lenses = (r.lenses || (r.lens ? [r.lens] : [])).map((ln, li) => {
    const c = P.p(ln.center);
    return { ...ln, li, c, t: (ll) => { const q = P.p(ll); return [ln.at[0] + (q[0] - c[0]) * ln.m, ln.at[1] + (q[1] - c[1]) * ln.m]; }, legs: "" };
  });
  const lensOf = {};
  lenses.forEach((L) => L.stops.forEach((n) => { lensOf[n] = L; }));
  const pos = {}, lpos = {};
  r.stops.forEach((st, i) => { pos[i + 1] = P.p(st.ll); });
  const mainKeys = r.stops.map((_, i) => i + 1).filter((n) => !lensOf[n]);
  relax(pos, mainKeys);
  r.stops.forEach((st, i) => { if (st.nudge) { pos[i + 1][0] += st.nudge[0]; pos[i + 1][1] += st.nudge[1]; } });
  lenses.forEach((L) => {
    const lp = {};
    L.stops.forEach((n) => { lp[n] = L.t(r.stops[n - 1].ll); });
    relax(lp, L.stops);
    Object.assign(lpos, lp);
  });

  // 起點、終點、途中
  const first = r.path[0][1], last = r.path[r.path.length - 1][1];
  const kindOf = (n) => (n === last ? "end" : n === first ? "start" : "mid");

  // 路線
  let legsMain = "";
  const used = new Set();
  for (let i = 1; i < r.path.length; i++) {
    const a = r.path[i - 1][1], [mode, b, bendOpt] = r.path[i];
    used.add(mode);
    const bend = bendOpt == null ? 0.14 : bendOpt;
    const La = lensOf[a], Lb = lensOf[b];
    if (La && La === Lb) { La.legs += legSvg(lpos[a], lpos[b], mode, bend); continue; }
    // 進出放大圈的路線：主圖畫到實際位置；渡輪這類（stubs）在圈內也畫一段，看得出從哪個港口上岸
    legsMain += legSvg(La ? P.p(r.stops[a - 1].ll) : pos[a], Lb ? P.p(r.stops[b - 1].ll) : pos[b], mode, bend);
    [La, Lb].forEach((L) => {
      if (L && L.stubs) L.legs += legSvg(lensOf[a] === L ? lpos[a] : L.t(r.stops[a - 1].ll), lensOf[b] === L ? lpos[b] : L.t(r.stops[b - 1].ll), mode, bend);
    });
  }

  const island = ringPath(GEO_PTS.jeju, P.p), udo = ringPath(GEO_PTS.udo, P.p);
  const halla = P.p([33.3617, 126.5292]);
  const showHalla = halla[0] > 20 && halla[0] < RM_W - 20 && halla[1] > 20 && halla[1] < H - 20 && !r.hideHalla;

  // 全島小地圖（預設右下角），框出這張圖的範圍
  const mini = rmProjector({ n: 33.58, s: 33.18, w: 126.14, e: 126.98 });
  const ms = 78 / RM_W, mx = r.miniAt ? r.miniAt[0] : RM_W - 86, my = r.miniAt ? r.miniAt[1] : H - mini.h * ms - 8;
  const v = r.view, a0 = mini.p([v.n, v.w]), a1 = mini.p([v.s, v.e]);
  const miniSvg = r.noMini ? "" : `<g class="rm-mini" transform="translate(${f1(mx)} ${f1(my)}) scale(${ms})">
      <rect x="-14" y="-14" width="${RM_W + 28}" height="${mini.h + 28}" rx="30" class="rm-mini-bg"/>
      <path d="${ringPath(GEO_PTS.jeju, mini.p)}" class="rm-mini-land"/>
      <rect x="${f1(Math.max(a0[0], -6))}" y="${f1(Math.max(a0[1], -6))}" width="${f1(Math.min(a1[0], RM_W + 6) - Math.max(a0[0], -6))}" height="${f1(Math.min(a1[1], mini.h + 6) - Math.max(a0[1], -6))}" class="rm-mini-box"/>
    </g>`;

  const lensSvg = lenses.map((L) => {
    const cid = `rmclip-${di}-${L.li}`;
    return `
      <circle cx="${f1(L.c[0])}" cy="${f1(L.c[1])}" r="${f1(Math.min(L.r / L.m + 3, 22))}" class="rm-lens-src"/>
      <path d="M${f1(L.c[0])} ${f1(L.c[1])}L${f1(L.at[0])} ${f1(L.at[1])}" class="rm-lens-link"/>
      <clipPath id="${cid}"><circle cx="${L.at[0]}" cy="${L.at[1]}" r="${L.r}"/></clipPath>
      <circle cx="${L.at[0]}" cy="${L.at[1]}" r="${L.r}" class="rm-lens-bg"/>
      <g clip-path="url(#${cid})"><rect x="${L.at[0] - L.r}" y="${L.at[1] - L.r}" width="${2 * L.r}" height="${2 * L.r}" class="rm-sea"/><path d="${ringPath(GEO_PTS.udo, L.t)}" class="rm-land"/><path d="${ringPath(GEO_PTS.jeju, L.t)}" class="rm-land"/>${L.legs}</g>
      <circle cx="${L.at[0]}" cy="${L.at[1]}" r="${L.r}" class="rm-lens-rim"/>
      <text x="${L.at[0]}" y="${f1(L.at[1] - L.r - 7)}" text-anchor="middle" class="rm-lens-name">${esc(L.name)}（放大）</text>`;
  }).join("");

  const stopsMain = mainKeys.map((n) => stopSvg(r.stops[n - 1], n, pos[n], kindOf(n), di)).join("");
  const stopsLens = lenses.map((L) => L.stops.map((n) => stopSvg(r.stops[n - 1], n, lpos[n], kindOf(n), di)).join("")).join("");

  const legend = [...used].filter((m) => RM_MODES[m] && RM_MODES[m].label).map((m) => {
    const md = RM_MODES[m];
    const sample = md.core
      ? `<path d="M3 7h26" class="rm-case"/><path d="M3 7h26" class="rm-core" stroke="${md.core}"/>`
      : `<path d="M3 7h26" class="rm-line" stroke-dasharray="${md.dash}"/>`;
    return `<span class="rm-key"><svg viewBox="0 0 32 14" aria-hidden="true">${sample}</svg>${md.label}</span>`;
  }).join("");

  return `
    <figure class="route-map">
      <figcaption class="rm-cap">今日路線<span class="rm-cap-sub">點編號可跳到行程</span></figcaption>
      <svg viewBox="0 0 ${RM_W} ${H}" role="img" aria-label="${esc(dayName(di))}路線示意圖：${r.path.map((p) => esc(r.stops[p[1] - 1].name)).join(" → ")}">
        <rect width="${RM_W}" height="${H}" class="rm-sea"/>
        <path d="${island}" class="rm-land"/>
        <path d="${udo}" class="rm-land"/>
        ${showHalla ? `<g class="rm-halla" transform="translate(${f1(halla[0])} ${f1(halla[1])})"><path d="M-15 8-4-8q4-4 8 0L15 8z"/><path d="M-7-3q3 2 7 0t7 0" class="snow"/><text y="22" text-anchor="middle">漢拏山</text></g>` : ""}
        ${miniSvg}
        <g class="rm-compass" transform="translate(${RM_W - 22} 24)"><path d="M0-13 6 6 0 2-6 6z"/><text y="-17" text-anchor="middle">N</text></g>
        ${legsMain}
        ${lensSvg}
        ${stopsMain}
        ${stopsLens}
      </svg>
      <div class="rm-legend">
        <span class="rm-key"><i class="rm-dot k-start"></i>起點</span>
        <span class="rm-key"><i class="rm-dot k-mid"></i>途中</span>
        <span class="rm-key"><i class="rm-dot k-end"></i>終點</span>
        ${legend}
      </div>
    </figure>`;
}


function dayHtml(d, i) {
  const st = d.stay;
  const stayHtml = st.none
    ? `<div class="tl-stay">${icon("i-plane")}<div><div class="lbl">住宿</div><div class="nm">${esc(st.name)}</div><div class="ar">${esc(st.area)}</div></div></div>`
    : `<div class="tl-stay">${icon("i-bed")}<div><div class="lbl">今晚住宿</div><div class="nm">${esc(st.name)}</div><div class="ar">${esc(st.area)}・<a class="maplink" href="${mapUrl(st.q)}" target="_blank" rel="noopener">開啟地圖</a></div></div></div>`;
  return `
    <article class="day" id="day-${i + 1}" aria-labelledby="day-${i + 1}-h">
      <div class="card day-head">
        <div class="day-art paused" aria-hidden="true"><svg viewBox="0 0 80 80">${DAY_ART[i] || ""}</svg></div>
        <div class="day-head-text">
          <p class="no"><span class="day-badge">${dayName(i)}</span>${esc(d.md)}（${esc(d.wd)}）</p>
          <h3 id="day-${i + 1}-h">${d.title.split("・").map((s) => `<span class="nowrap">${esc(s)}</span>`).join("・")}</h3>
        </div>
      </div>
      ${routeMapHtml(d, i)}
      <ol class="tl">${d.items.map((it, j) => itemHtml(it, `d${i + 1}-i${j}`)).join("")}</ol>
      ${stayHtml}
      ${d.planB ? `
      <details class="planb">
        <summary>${esc(d.planB.title)}<span class="planb-hint">點開查看</span></summary>
        <p class="planb-note">${esc(d.planB.note)}</p>
        <ol class="tl">${d.planB.items.map((it) => itemHtml(it)).join("")}</ol>
      </details>` : ""}
    </article>`;
}

function initDays() {
  const s = tripStatus(getNow());
  const todayIdx = s.phase === "during" ? s.day - 1 : -1;
  renderTabs(todayIdx);
  $("dayList").innerHTML = DAYS.map(dayHtml).join("");

  // 路線圖：點景點編號 → 捲到時間軸對應項目並短暫標示
  $("dayList").addEventListener("click", (e) => {
    const a = e.target.closest(".rm-stop");
    if (!a) return;
    e.preventDefault();
    const li = $(a.dataset.target);
    if (!li) return;
    const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    li.scrollIntoView({ block: "center", behavior: reduce ? "instant" : "smooth" });
    li.classList.remove("flash");
    void li.offsetWidth;
    li.classList.add("flash");
    setTimeout(() => li.classList.remove("flash"), 2200);
  });

  const tabs = $("dayTabs");
  const tabEls = [...tabs.querySelectorAll(".tab")];
  const setCurrent = (i) => tabEls.forEach((t, j) => t.setAttribute("aria-current", j === i ? "true" : "false"));
  setCurrent(todayIdx >= 0 ? todayIdx : 0);
  tabs.addEventListener("click", (e) => {
    const t = e.target.closest(".tab");
    if (t) setCurrent(Number(t.dataset.day));
  });

  // 日期列實際高度 → CSS 變數，讓跳轉後的標題不被日期列擋住（字型載入後高度可能改變）
  const syncTabsH = () => document.documentElement.style.setProperty("--tabs-h", tabs.offsetHeight + "px");
  syncTabsH();
  if ("ResizeObserver" in window) new ResizeObserver(syncTabsH).observe(tabs);

  // 捲動時用 IntersectionObserver 判定目前看到哪一天（畫面 35%～40% 的帶狀區域），不監聽 scroll
  if ("IntersectionObserver" in window) {
    const io = new IntersectionObserver((entries) => {
      entries.forEach((en) => { if (en.isIntersecting) setCurrent(Number(en.target.id.slice(4)) - 1); });
    }, { rootMargin: "-35% 0px -60% 0px", threshold: 0 });
    document.querySelectorAll("#dayList .day").forEach((el) => io.observe(el));

    // 每日小插圖：只有出現在畫面上時才播放動畫
    const artIo = new IntersectionObserver((entries) => {
      entries.forEach((en) => en.target.classList.toggle("paused", !en.isIntersecting));
    });
    document.querySelectorAll("#dayList .day-art").forEach((el) => artIo.observe(el));
  } else {
    document.querySelectorAll("#dayList .day-art").forEach((el) => el.classList.remove("paused"));
  }

  // 旅程期間打開網頁：自動捲到當天（網址已指定位置或使用者已開始捲動時不動）
  if (todayIdx >= 0 && !location.hash) {
    const go = () => { if (window.scrollY === 0) $("day-" + (todayIdx + 1)).scrollIntoView({ block: "start", behavior: "instant" }); };
    const fontsReady = document.fonts ? document.fonts.ready : Promise.resolve();
    Promise.race([fontsReady, new Promise((r) => setTimeout(r, 1500))]).then(go);
  }
}

/* ===================== 必帶物品（勾選狀態存在 localStorage） ===================== */
const PACK_KEY = "jeju-trip-2026-pack-v1";
const packStore = (() => {
  try {
    localStorage.setItem("__jeju_test__", "1");
    localStorage.removeItem("__jeju_test__");
    return localStorage;
  } catch (e) {
    return null;
  }
})();

function initPacking() {
  let done = {};
  try { done = JSON.parse((packStore && packStore.getItem(PACK_KEY)) || "{}") || {}; } catch (e) { done = {}; }
  const save = () => {
    if (!packStore) return;
    try { packStore.setItem(PACK_KEY, JSON.stringify(done)); } catch (e) { $("packWarn").hidden = false; }
  };
  const count = () => {
    const n = PACKING.filter((t) => done[t]).length;
    $("packCount").textContent = `已準備 ${n} / ${PACKING.length}`;
  };
  $("packWarn").hidden = !!packStore;
  $("packList").innerHTML = PACKING.map((t) => `
    <li><label class="pack-item${done[t] ? " done" : ""}">
      <input type="checkbox" data-k="${esc(t)}"${done[t] ? " checked" : ""}>
      <span class="pack-box">${icon("i-check")}</span><span class="pack-txt">${esc(t)}</span>
    </label></li>`).join("");
  $("packList").addEventListener("change", (e) => {
    const cb = e.target;
    if (!cb.matches("input[type=checkbox]")) return;
    if (cb.checked) done[cb.dataset.k] = true; else delete done[cb.dataset.k];
    cb.closest(".pack-item").classList.toggle("done", cb.checked);
    save(); count();
  });
  $("packReset").addEventListener("click", () => {
    done = {};
    $("packList").querySelectorAll("input").forEach((cb) => { cb.checked = false; cb.closest(".pack-item").classList.remove("done"); });
    save(); count();
  });
  count();
}

/* ===================== 住宿 ===================== */
function renderStays() {
  $("stayList").innerHTML = STAYS.map((s) => `
    <article class="card stay">
      <div class="stay-top">${icon("i-house")}<div><h3>${esc(s.name)}</h3><p>${esc(s.area)}・${esc(s.nights)}</p></div></div>
      <div class="stay-body">
        <dl class="kv">
          <dt>入住</dt><dd>${esc(s.checkIn)}</dd>
          <dt>退房</dt><dd>${esc(s.checkOut)}</dd>
        </dl>
        <a class="btn-map" href="${mapUrl(s.q)}" target="_blank" rel="noopener">${icon("i-pin")}用名稱搜尋 Google Maps</a>
      </div>
    </article>`).join("");
}

/* ===================== 導覽目前區塊（IntersectionObserver） ===================== */
function initNav() {
  const links = {};
  document.querySelectorAll("[data-nav]").forEach((a) => { links[a.dataset.nav] = a; });
  const setActive = (id) => {
    Object.keys(links).forEach((k) => links[k].setAttribute("aria-current", k === id ? "true" : "false"));
  };
  setActive("home");
  if (!("IntersectionObserver" in window)) return;
  // 以畫面上方 30%～40% 的帶狀區域判定目前所在區塊，不需要監聽 scroll
  const io = new IntersectionObserver((entries) => {
    entries.forEach((en) => { if (en.isIntersecting) setActive(en.target.id); });
  }, { rootMargin: "-30% 0px -60% 0px", threshold: 0 });
  document.querySelectorAll("[data-section]").forEach((s) => io.observe(s));

  // Hero 不在畫面上時暫停插圖動畫
  const art = $("heroArt");
  new IntersectionObserver((en) => art.classList.toggle("paused", !en[0].isIntersecting)).observe(art);
}

/* ===================== 啟動 ===================== */
renderHero();
renderFlights();
initDays();
renderStays();
initPacking();
initNav();
setInterval(updateCountdown, 60000);
</script>
